<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tarot Nails</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1> <em>The Tarot Nails</em></h1>
        <nav>
            <a href="#servicios">Servicios</a>
            <a href="#reserva">Reservas</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section id="servicios">
        <h2>Nuestros Servicios</h2>
        <ul>
            <li>Manicura - $15</li>
            <li>Pedicura - $20</li>
            <li>Uñas Acrílicas - $30</li>
            <li>Decoración Especial - $25</li>
        </ul>
    </section>

    <section id="reserva">
        <h2>Reservar Cita</h2>
        <form id="reservaForm">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required>

            <label for="servicio">Servicio:</label>
            <select id="servicio" required>
                <option value="Manicura">Manicura</option>
                <option value="Pedicura">Pedicura</option>
                <option value="Uñas Acrílicas">Uñas Acrílicas</option>
                <option value="Decoración Especial">Decoración Especial</option>
            </select>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>

            <label for="hora">Hora:</label>
            <select id="hora" required>
                <!-- Horarios se cargarán con JavaScript -->
            </select>

            <button type="submit">Reservar</button>
        </form>
        <p id="mensaje"></p>
    </section>

    <section id="contacto">
        <h2>Contacto</h2>
        <p>Instagram: @thetarotnails_</p>
        <p>WhatsApp: +506 71586607</p>
        <p>Dirección: El Carmen, Alajuela</p>
    </section>

    <footer>
        <p>© 2025 The Tarot Nails</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // SCRIPT PARA HORARIOS Y MENSAJE PERSONALIZADO
        const form = document.getElementById("reservaForm");
        const fechaInput = document.getElementById("fecha");
        const horaSelect = document.getElementById("hora");
        const mensaje = document.getElementById("mensaje");

        // Horarios disponibles
        const horarios = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];
        let reservas = {};

        function actualizarHorarios() {
            const fecha = fechaInput.value;
            horaSelect.innerHTML = "";
            horarios.forEach(hora => {
                if (!reservas[fecha] || !reservas[fecha].includes(hora)) {
                    const option = document.createElement("option");
                    option.value = hora;
                    option.textContent = hora;
                    horaSelect.appendChild(option);
                }
            });
        }

        fechaInput.addEventListener("change", actualizarHorarios);

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value;
            const telefono = document.getElementById("telefono").value;
            const servicio = document.getElementById("servicio").value;
            const fecha = fechaInput.value;
            const hora = horaSelect.value;

            if (!reservas[fecha]) reservas[fecha] = [];
            reservas[fecha].push(hora); // Bloquear horario

            // Mensaje personalizado con el nombre del cliente
            mensaje.textContent = `¡Gracias, ${nombre}! Tu cita para ${servicio} está confirmada el ${fecha} a las ${hora}.`;

            // Desaparecer mensaje después de 5 segundos
            setTimeout(() => {
                mensaje.textContent = "";
            }, 5000);

            actualizarHorarios();
            form.reset();
        });
    </script>
</body>
</html>
