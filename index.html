<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tarot Nails | Uñas en Alajuela, Costa Rica</title>

<!-- 🔎 SEO Básico -->
<meta name="description" content="The Tarot Nails - Salón de uñas en Alajuela, Costa Rica. Servicios de manicure, pedicure, uñas acrílicas, Gel X, Polygel y más. Reserva tu cita en línea.">
<meta name="keywords" content="uñas, manicure, pedicure, gel x, polygel, uñas acrílicas, uñas Alajuela, The Tarot Nails">
<meta name="author" content="The Tarot Nails">
<meta name="robots" content="index, follow">

<!-- Fuentes -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #fff;
    color: #333;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    box-sizing: border-box;
  }

  header {
    background-color: #000;
    padding: 20px;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    text-align: center;
  }

  header h1 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 3rem;
    color: #fff;
    margin: 0;
    cursor: pointer;
  }

  nav {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav a {
    text-decoration: none;
    color: #f8f8f8;
    margin: 0 15px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    padding-bottom: 3px;
    transition: color 0.3s, border-bottom 0.3s;
    position: relative;
  }

  nav a:hover, nav a.active {
    color: #ff5c8d;
    border-bottom: 2px solid #ff5c8d;
  }

  section {
    opacity: 0;
    transform: translateY(30px);
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.8s ease, max-height 0.8s ease, transform 0.8s ease;
    padding: 0 20px;
    /* ❌ margin-top eliminado para evitar huecos */
  }

  section.active {
    opacity: 1;
    transform: translateY(0);
    max-height: 3000px;
    padding: 50px 20px;
    margin-top: 140px; /* ✅ ahora solo en la sección activa */
  }

  section h2 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 2rem;
    margin-bottom: 20px;
    color: #000;
  }

  section h3 {
    font-family: 'Cinzel Decorative', cursive;
    color: #000;
    margin-bottom: 10px;
  }

  .galeria-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    justify-items: center;
    padding: 20px;
  }

  .galeria-grid img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.5s ease, box-shadow 0.5s ease;
  }

  .galeria-grid img:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  #reserva iframe {
    width: 100%;
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    height: 700px;
  }

  footer {
    background-color: #000;
    color: #fff;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
  }

  .footer-info {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    align-items: center;
    margin: 5px 0;
  }

  footer p, footer a {
    margin: 0;
    color: #fff;
    text-decoration: none;
  }

  footer a:hover {
    color: #ff5c8d;
    text-decoration: underline;
  }

  /* Servicios */
  .servicios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }

  .servicios-grid .card {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .servicios-grid .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  }

  .servicios-grid h3 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 1.2rem;
    margin-bottom: 10px;
    color: #000;
  }

  .servicios-grid p {
    font-size: 1rem;
    color: #555;
    margin: 0;
  }

  /* Botón minimalista */
  .map-btn {
    display: inline-block;
    background: #000;
    color: #fff;
    padding: 12px 25px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.3s;
  }

  .map-btn:hover {
    background: #ff5c8d;
  }

  /* Botón Instagram */
  .insta-btn {
    display: inline-block;
    padding: 12px 25px;
    background: #ff5c8d;
    color: #fff;
    font-weight: bold;
    text-decoration: none;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .insta-btn:hover {
    background: #e14d7a;
    transform: translateY(-2px);
  }

  /* Responsivo */
  @media (max-width: 768px) {
    header h1 { font-size: 2.2rem; }
    nav a { font-size: 0.95rem; margin: 5px 10px; }
    section.active { padding: 35px 15px; }
    .galeria-grid img { height: 220px; }
    #reserva iframe { height: 500px; }
  }

  @media (max-width: 480px) {
    header {
      padding: 10px 6px;
    }
    header h1 { font-size: 1.4rem; letter-spacing: 1px; }
    nav { gap: 8px; }
    nav a { font-size: 0.8rem; padding-bottom: 2px; }
    section.active { padding: 20px 10px; }
    .galeria-grid img { height: 180px; }
    #reserva iframe { height: 400px; }
  }
</style>
</head>
<body>
