<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tarot Nails</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        /* Encabezado */
        header {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        /* Título principal */
        header h1 {
            font-family: 'Playfair Display', serif; /* Elegante y lineal */
            font-size: 3rem;
            margin: 0 0 20px 0;
            font-weight: 700;
        }

        /* Menú de navegación */
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 30px; /* Espaciado entre elementos */
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 400;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #f4c2c2; /* Color suave al pasar el mouse */
        }
    </style>
</head>
<body>

    <header>
        <h1>The Tarot Nails</h1>
        <nav>
            <ul>
                <li><a href="#conozcanos">Conózcanos</a></li>
                <li><a href="#servicios">Servicios</a></li>
                <li><a href="#galeria">Galería</a></li>
                <li><a href="#reserva">Reserva tu cita</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
